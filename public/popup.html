<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Focus</title>
  <link rel="stylesheet" href="switch.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.mjs"></script>
</head>

<body>
  <main>
    <fieldset id="youtube-watched-videos">
      <legend class="section-title">Watched Videos</legend>
      <div class="segmented">
        <button type="button" aria-pressed="false" data-mode="SHOW">Show</button>
        <button type="button" aria-pressed="false" data-mode="DIM">Dim</button>
        <button type="button" aria-pressed="false" data-mode="HIDE">Hide</button>
      </div>
      <p id="youtube-watched-videos-caption" aria-live="polite"></p>
    </fieldset>

    <hr class="separator">

    <label class="toggle-row" for="youtube-distractions-toggle">
      <span>Hide YouTube Distractions</span>
      <span class="switch">
        <input id="youtube-distractions-toggle" type="checkbox">
        <span class="slider"></span>
      </span>
    </label>
    <div id="youtube-distractions-status" aria-live="polite">
      <strong id="youtube-distractions-status-title"></strong>
      <span id="youtube-distractions-status-detail"></span>
    </div>
  </main>

  <button id="open-settings" type="button">Open Settings</button>
</body>

</html>
