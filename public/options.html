<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Focus</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="options.css">
  <link rel="icon" type="image/png" href="icon_32.png">
  <script type="module" src="options.mjs"></script>
</head>

<body>
  <h1>
    <button id="passcode-button" type="button" aria-label="Set passcode" title="Set passcode">
      <img src="icon_128.png" alt="">
    </button>
    <span>ocus</span>
  </h1>

  <div class="options">
    <div id="enabled-option" class="option">
      <label for="enabled">Enabled?</label>
      <select id="enabled">
        <option value="YES">Yes</option>
        <option value="NO">No</option>
      </select>
    </div>

    <div id="context-menu-option" class="option">
      <label for="context-menu">Context menu?</label>
      <select id="context-menu">
        <option value="YES">Yes</option>
        <option value="NO">No</option>
      </select>
    </div>
  </div>

  <div id="content-tabs">
    <button type="button" class="content-tab active" data-content="blocked">Sites to block</button>
    <button type="button" class="content-tab" data-content="schedules">Global schedule</button>
  </div>

  <div id="blocked-container" class="content-panel">
    <div id="blocked-editor">
      <pre id="blocked-highlight" aria-hidden="true"><code></code></pre>
      <textarea id="blocked-list" rows="10" cols="50" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="schedules-container" class="content-panel" hidden>
    <div id="schedule-editor">
      <pre id="schedule-highlight" aria-hidden="true"><code></code></pre>
      <textarea id="schedule-rules" rows="10" cols="50" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="options">
    <div id="resolution-option" class="option baseline">
      <label for="resolution">How to resolve blocked?</label>
      <div>
        <select id="resolution">
          <option value="CLOSE_TAB">Close Tab</option>
          <option value="SHOW_BLOCKED_INFO_PAGE">Show Blocked info page</option>
        </select>

        <fieldset id="blocked-info-page-details">
          <div class="option">
            <label for="counter-show">Show blocked count?</label>
            <select id="counter-show">
              <option value="YES">Yes</option>
              <option value="NO">No</option>
            </select>
          </div>

          <div id="counter-period-option" class="option">
            <label for="counter-period">Blocked count period?</label>
            <select id="counter-period">
              <option value="ALL_TIME">All Time</option>
              <option value="THIS_MONTH">This Month</option>
              <option value="THIS_WEEK">This Week</option>
              <option value="TODAY">Today</option>
            </select>
          </div>
        </fieldset>
      </div>
    </div>
  </div>

  <dialog id="passcode-dialog">
    <div id="passcode-dialog-body">
      <div id="passcode-inputs">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 1">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4">
      </div>
      <p id="passcode-prompt">Enter Screen Time passcode</p>
      <p id="passcode-error" aria-live="polite"></p>
    </div>
    <div id="passcode-dialog-footer">
      <button id="passcode-close" type="button">Close</button>
    </div>
  </dialog>

</body>

</html>
